# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TAUARGUSENGINE_VERSION: "0.5.3"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # tauargusengine is not on CRAN: install the pinned version from
      # the GitHub Packages registry first (the dependency action
      # would otherwise fail to resolve it). Needs the GITHUB_PAT
      # secret (a PAT with read:packages on trygu/tauargus-engine);
      # GITHUB_TOKEN cannot be used for R installs from GitHub
      # Packages.
      - name: Install tauargusengine (pinned, from GitHub Packages)
        env:
          TAUARGUSENGINE_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          install.packages("pak", repos = "https://cloud.r-project.org")
          pak::repo_add(github = "trygu", token = Sys.getenv("TAUARGUSENGINE_PAT"))
          pak::pkg_install(
            "tauargusengine",
            version = Sys.getenv("TAUARGUSENGINE_VERSION")
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
