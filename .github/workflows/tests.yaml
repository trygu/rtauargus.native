# Installs the pinned tauargusengine binary from the engine's GitHub
# Releases and runs the rtauargus test suite, including the native
# engine e2e tests (tests/testthat/test_engine_*.R) that run .arb
# batches through the installed tauargusengine.
#
# The engine release r-v<version> must exist before this workflow can
# pass (it is cut together with the lockstep py-v<version> release).

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TAUARGUSENGINE_VERSION: "0.5.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Install tauargusengine (pinned, from the GitHub Release)
        run: |
          install.packages(
            paste0(
              "https://github.com/trygu/tauargus-engine/releases/download/r-v",
              Sys.getenv("TAUARGUSENGINE_VERSION"), "/tauargusengine_",
              Sys.getenv("TAUARGUSENGINE_VERSION"),
              "_r4.4.3_linux-x86_64.tar.gz"),
            repos = NULL, type = "binary")
        shell: Rscript {0}

      # Installs the remaining dependencies (tauargusengine is already
      # installed and is skipped).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run the test suite
        run: testthat::test_local(".", stop_on_failure = TRUE)
        shell: Rscript {0}
