# Build the two R packages from the pinned tauargus-engine submodule and
# publish them as one GitHub Release set.
#
# This repo is the R release channel. The engine and the tauargusengine
# binding sources come from the submodule (the gitlink is the engine pin);
# no separately published engine release is needed. The reusable build
# script (stage-r-package.sh) and the binding build definitions live in
# the submodule and are not duplicated here.
#
# Each build job (linux, macos, windows):
#   1. checks out this repo with the tauargus-engine submodule (recursive),
#   2. installs the CRAN dependencies of the front-end,
#   3. stages the self-contained tauargusengine source package via the
#      submodule's stage-r-package.sh (clones the pinned HiGHS itself),
#   4. builds the tauargusengine source tarball and installs it (the
#      front-end build below resolves its Imports while processing the
#      help pages),
#   5. builds the rtauargus.native source tarball,
#   6. installs both packages from the tarballs into a fresh library,
#      runs the full rtauargus.native test suite (includes the native
#      engine e2e tests), and repackages the installed binding as a
#      platform binary.
#
# The clean-room job (on tags/dispatch) installs the platform binary in a
# container without a checkout and no compiler, and verifies the
# front-end source tarball statically. The publish job (on r-v* tags)
# cuts the GitHub Release with both source tarballs and the three
# platform binaries.

name: release

on:
  push:
    branches: ["**"]
    tags: ["r-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  R_VERSION: "4.4.3"

jobs:
  build:
    name: ${{ matrix.osname }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, osname: linux, arch: x86_64 }
          - { os: macos-15, osname: macos, arch: arm64 }
          - { os: windows-2022, osname: windows, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # pandoc for the vignette build (not preinstalled on macos/windows).
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies (linux)
        if: matrix.osname == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libcurl4-openssl-dev libssl-dev libuv1-dev

      # CRAN dependencies of the front-end (needed to build its tarball
      # and to run the test suite). tauargusengine is not on CRAN; it is
      # installed from the staged source package below. The script lives
      # in the repo (tools/) because the Windows runner mangles multi-line
      # single-quoted Rscript -e arguments.
      - name: Install package dependencies
        shell: bash
        run: Rscript tools/install-deps.R

      # Stage the distributable tauargusengine source package from the
      # submodule. On a release tag the version comes from the tag
      # (r-vX.Y.Z -> X.Y.Z).
      - name: Stage the tauargusengine source package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/r-v* ]]; then
            tauargus-engine/scripts/stage-r-package.sh \
              --version "${GITHUB_REF#refs/tags/r-v}"
          else
            tauargus-engine/scripts/stage-r-package.sh
          fi

      # Building the front-end tarball (next step) installs the package
      # to process the help pages, so all its Imports must be available:
      # build the binding tarball and install it first.
      - name: Build and install the tauargusengine binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dist
          (cd build/dist && R CMD build \
            "$GITHUB_WORKSPACE/tauargus-engine/build/r-package/tauargusengine")
          R CMD INSTALL build/dist/tauargusengine_*.tar.gz

      # Build the front-end source tarball. The engine submodule, the
      # gitmodules file and the build output are excluded (see
      # .Rbuildignore).
      - name: Build the rtauargus.native source package
        shell: bash
        run: |
          set -euo pipefail
          (cd build/dist && R CMD build "$GITHUB_WORKSPACE")

      # The documented install procedure: both packages from their
      # tarballs into a fresh library. The binding's configure builds
      # HiGHS and the engine from the package's own bundled sources. The
      # installed binding is repackaged as the platform binary.
      - name: Install, test, package the binary
        shell: bash
        run: |
          set -euo pipefail
          RLIB="$GITHUB_WORKSPACE/.rlib"
          rm -rf "$RLIB"
          mkdir -p "$RLIB"
          R CMD INSTALL --library="$RLIB" build/dist/tauargusengine_*.tar.gz
          R CMD INSTALL --library="$RLIB" build/dist/rtauargus.native_*.tar.gz
          R_LIBS="$RLIB" Rscript tools/engine-meta-check.R
          cd tests
          R_LIBS="$RLIB" Rscript testthat.R
          cd "$GITHUB_WORKSPACE"
          mkdir -p build/bin
          VER="$(tar -xzOf build/dist/tauargusengine_*.tar.gz \
            tauargusengine/DESCRIPTION | awk -F': ' '/^Version:/{print $2; exit}')"
          RVER="$(Rscript -e 'cat(R.version$major, ".", R.version$minor, sep = "")')"
          NAME="tauargusengine_${VER}_r${RVER}_${{ matrix.osname }}-${{ matrix.arch }}"
          if [ "${{ matrix.osname }}" = "windows" ]; then
            # Standard R Windows binary format: a zip of the installed
            # package directory (bsdtar picks the format from -a).
            tar -a -c -f "build/bin/${NAME}.zip" -C "$RLIB" tauargusengine
          else
            # Standard R Linux/macOS binary format: gzipped tarball of
            # the installed package directory.
            tar -czf "build/bin/${NAME}.tar.gz" -C "$RLIB" tauargusengine
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.osname }}-${{ matrix.arch }}
          path: build/bin/tauargusengine_*

      - name: Upload source
        if: matrix.osname == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            build/dist/tauargusengine_*.tar.gz
            build/dist/rtauargus.native_*.tar.gz

  clean-room:
    name: clean-room (linux, no checkout)
    needs: build
    if: startsWith(github.ref, 'refs/tags/r-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install system deps
        run: |
          apt-get update
          # setup-r needs sudo, which the bare ubuntu image lacks.
          apt-get install -y --no-install-recommends binutils ca-certificates sudo

      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-x86_64
          path: pkg

      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install the binary and run the smoke test
        shell: bash
        run: |
          set -euo pipefail
          RLIB="$(mktemp -d)/Rlib"
          mkdir -p "$RLIB"
          R CMD INSTALL --library="$RLIB" pkg/tauargusengine_*.tar.gz
          # tests/ is not part of an installed package, so the smoke
          # runs inline from the installed library only.
          R_LIBS="$RLIB" Rscript -e '
            library(tauargusengine)
            engine <- new_tauargus()
            version <- tauargus_version(engine)
            stopifnot(nchar(version) > 0L)
            stopifnot(!is.null(new_hitas()), !is.null(new_rounder()))
            meta <- tauargus_engine_meta()
            stopifnot(!is.na(meta[["engine_sha"]]),
                      nchar(meta[["highs_version"]]) > 0L)
            cat("clean-room smoke ok:", version, "\n")'

          # No build paths may be referenced by the loaded objects.
          # libR.so is provided by the R runtime, not the system, so
          # resolve it against R's own lib directory.
          LDD="$(LD_LIBRARY_PATH="$(R RHOME)/lib" ldd "$RLIB/tauargusengine/libs/tauargusengine.so")"
          echo "$LDD"
          if echo "$LDD" | grep -E "not found"; then
            echo "clean-room: missing shared object" >&2
            exit 1
          fi
          echo "clean-room: binding ok"

      # The two-package install from the release files is exercised on
      # all three build jobs (both tarballs into a fresh library, full
      # suite); here the front-end tarball is verified statically, since
      # installing it would need its CRAN dependencies in this container.
      - name: Verify the front-end source tarball
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          tar -xzf src/rtauargus.native_*.tar.gz -C "$TMP"
          PKG="$TMP/rtauargus.native"
          test -f "$PKG/DESCRIPTION"
          test -f "$PKG/NAMESPACE"
          grep -q "^Package: rtauargus.native$" "$PKG/DESCRIPTION"
          grep -q "import(tauargusengine)" "$PKG/NAMESPACE"
          if tar -tzf src/rtauargus.native_*.tar.gz | grep -qE "tauargus-engine/|\.gitmodules"; then
            echo "clean-room: engine content leaked into the front-end tarball" >&2
            exit 1
          fi
          echo "clean-room: front-end tarball ok"

  publish:
    name: publish (GitHub Release)
    needs: build
    if: startsWith(github.ref, 'refs/tags/r-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Check the tag matches the engine package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/r-v}"
          VER="$(tar -xzOf dist/source/tauargusengine_*.tar.gz tauargusengine/DESCRIPTION \
                  | awk -F': ' '/^Version:/{print $2; exit}')"
          if [[ "$VER" != "$TAG" ]]; then
            echo "tag r-v$TAG does not match package version $VER" >&2
            exit 1
          fi
          echo "version: $VER"

      - name: GitHub Release with source + binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/source/*.tar.gz
            dist/bin-linux-x86_64/*
            dist/bin-macos-arm64/*
            dist/bin-windows-x86_64/*
          generate_release_notes: true
          body: |
            R release set: `tauargusengine` (native binding) and
            `rtauargus.native` (R front-end), built from the pinned
            tauargus-engine submodule. `tauargusengine::tauargus_engine_meta()`
            reports the exact engine SHA and HiGHS version this build came
            from.

            Install both from this release (binary, no compiler; R 4.4.3):

                install.packages(
                  "https://github.com/trygu/rtauargus.native/releases/download/r-vX.Y.Z/tauargusengine_X.Y.Z_r4.4.3_linux-x86_64.tar.gz",
                  repos = NULL, type = "binary")
                install.packages(
                  "https://github.com/trygu/rtauargus.native/releases/download/r-vX.Y.Z/rtauargus.native_1.3.6.tar.gz",
                  repos = NULL)
                library(rtauargus.native)

            (macOS: ..._macos-arm64.tar.gz; Windows: ..._windows-x86_64.zip)

            The `rtauargus.native` source tarball is pure R and installs on
            any platform; only the binding needs the platform binary.
